name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pytest:
    name: pytest (Tkinter + Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 1 (дефолт checkout@v7) присылает shallow-клон:
          # 1 коммит и 1 тег. Сторож tests/test_git_history.py требует
          # >= 8 релизных тегов и падает на урезанном списке, т.к. без
          # истории он был бы тривиально зелёным. Ослаблять сторож -
          # значит потерять его; CI обязан видеть полную историю.
          fetch-depth: 0

      - name: Install Tkinter, venv and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pytest

      - name: Run tests under Xvfb
        run: xvfb-run -a .venv/bin/python -m pytest tests/ -q
